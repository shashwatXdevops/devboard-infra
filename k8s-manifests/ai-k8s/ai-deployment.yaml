apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-deployment
  template:
    metadata:
      labels:
        app: api-deployment
    spec:
      containers:
      - name: ai-service 
        image: ghcr.io/shashwatXdevops/ai-service:latest
        ports:
        - containerPort: 50051
        
        