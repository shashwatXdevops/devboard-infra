apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-deployment
  template:
    metadata:
      labels:
        app: frontend-deployment
    spec:
      containers:
      - name: frontend 
        image: ghcr.io/shashwatXdevops/frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: VITE_API_HOST
          value: "http://backend-svc:8000"