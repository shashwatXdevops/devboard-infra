apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-deployment
  template:
    metadata:
      labels:
        app: backend-deployment
    spec:
      containers:
      - name: core-backend
        image: ghcr.io/shashwatXdevops/core-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: JWT_SECRET_KEY 
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: JWT_SECRET_KEY 
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DATABASE_URL
        - name: MONGO_URL
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: MONGO_URL
        - name: AI_SERVICE_HOST
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: AI_SERVICE_HOST